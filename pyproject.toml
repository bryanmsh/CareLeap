# Shared project config. Started by M4 for api/ + planner/; other members add their
# packages to [tool.setuptools.packages.find] and their dependencies below.
[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "careleap"
version = "0.1.0"
description = "CareLeap: Reachable Care"
requires-python = ">=3.12"
dependencies = [
    # api/ (M4)
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
    # planner/ (M4): reads visit_rules.yaml
    "pyyaml==6.0.3",
    # engine/audit + pipeline/ (M1/M2): cube, origins, stops_walk (parquet via pyarrow)
    "numpy==2.3.5",
    "pandas==2.3.3",
    "pyarrow==25.0.1",
    "pyshp==2.3.1",        # pipeline/build_origins.py reads TIGER shapefiles
]

[project.optional-dependencies]
dev = [
    "httpx2==2.16.0",      # fastapi.testclient backend (starlette 1.10 deprecates httpx)
    "hypothesis==6.170.9", # property-based tests
    "ortools==9.15.6755",  # CP-SAT oracle for the schedule-optimizer property tests
    "pytest==9.1.1",
]
# GET /report PDF rendering. Needs Pango system libraries (apt: libpango-1.0-0
# libpangoft2-1.0-0 libharfbuzz-subset0; Windows: GTK3 runtime). Optional: without it
# /report?format=html still works and the PDF route answers 503.
report = [
    "weasyprint==70.0",
]
pipeline = [
    # data pipeline (origins, stops_walk, cube) — not needed to run the API with mocks
    "pandas",
    "numpy",
    "pyarrow",
    "pyshp",  # build_origins.py reads TIGER block-group shapefiles
]

[tool.setuptools.packages.find]
include = ["api*", "planner*"]

[tool.setuptools.package-data]
api = ["mocks/*.json", "mocks/planner/*"]

# pytest is configured in pytest.ini (M1), which takes precedence over this file.
